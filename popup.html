<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 0; font-family: system-ui, sans-serif; background: #101216; color: #f0f0f0; }
  .card { padding: 18px; }
  .header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .moon { width: 34px; height: 34px; border-radius: 10px; background: #1e2228; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  h1 { font-size: 16px; margin: 0; }
  .sub { font-size: 12px; color: #9aa0a8; margin: 0 0 16px 44px; }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #1b1e24; border: 1px solid #2c313a; border-radius: 12px; margin-bottom: 12px; }
  .row span { font-size: 13px; }
  .row small { display: block; font-size: 11px; color: #9aa0a8; margin-top: 2px; }
  .switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #3a4048; border-radius: 24px; cursor: pointer; transition: background 0.2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
  .switch input:checked + .slider { background: #2b5cb8; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .label { font-size: 12px; color: #ccc; margin: 12px 0 8px; }
  .swatches { display: flex; gap: 8px; }
  .swatch { flex: 1; border: 1px solid #2c313a; border-radius: 10px; padding: 8px 4px; background: #1b1e24; color: #f0f0f0; cursor: pointer; font-size: 12px; text-align: center; }
  .swatch.active { border-color: #8ab4ff; background: #2a3446; }
  .swatch .dot { width: 22px; height: 22px; border-radius: 50%; margin: 0 auto 6px; border: 1px solid #444; }
  .dot-dark { background: #171a1f; }
  .dot-oled { background: #000; }
  .dot-dim { background: #2a2a2a; }
  input[type="range"] { width: 100%; accent-color: #8ab4ff; }
  .val { font-size: 12px; color: #ccc; float: right; }
  .note { font-size: 11px; color: #888; margin-top: 14px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="moon">☾</div>
      <h1>EvarTheme Shifter</h1>
    </div>
    <p class="sub">Dark mode for your portal, LMS and the web</p>
    <div class="row">
      <span>Dark mode<small>On for this browser</small></span>
      <label class="switch"><input type="checkbox" id="enabled" checked><span class="slider"></span></label>
    </div>
    <div class="label">Theme</div>
    <div class="swatches">
      <button class="swatch active" data-theme="dark"><span class="dot dot-dark"></span>Dark</button>
      <button class="swatch" data-theme="oled"><span class="dot dot-oled"></span>OLED</button>
      <button class="swatch" data-theme="dim"><span class="dot dot-dim"></span>Dim</button>
    </div>
    <div class="label">Brightness <span class="val" id="brightnessVal">100%</span></div>
    <input type="range" id="brightness" min="70" max="110" value="100">
    <p class="note">Study only. Do not use during an online proctored exam or quiz. Images, videos and PDFs stay normal.</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
