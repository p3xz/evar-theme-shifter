<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 240px; margin: 0; padding: 16px; font-family: system-ui, sans-serif; background: #121212; color: #f0f0f0; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { font-size: 12px; color: #aaa; margin: 0 0 14px; }
  label { display: block; font-size: 12px; margin: 10px 0 4px; color: #ccc; }
  select, input[type="range"] { width: 100%; }
  select { background: #222; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .toggle { font-size: 13px; }
  .note { font-size: 11px; color: #888; margin-top: 14px; line-height: 1.5; }
  .val { font-size: 12px; color: #ccc; }
</style>
</head>
<body>
  <h1>KJU Dark</h1>
  <p>KJUsys and KJLMS only</p>
  <div class="row">
    <span class="toggle">Dark mode</span>
    <input type="checkbox" id="enabled" checked>
  </div>
  <label for="theme">Theme</label>
  <select id="theme">
    <option value="dark">Dark</option>
    <option value="oled">OLED black</option>
    <option value="dim">Dim</option>
  </select>
  <label for="brightness">Brightness <span class="val" id="brightnessVal">100%</span></label>
  <input type="range" id="brightness" min="70" max="110" value="100">
  <p class="note">Do not use during an online proctored exam or quiz. Study only. Images, videos and PDFs stay normal.</p>
  <script src="popup.js"></script>
</body>
</html>
